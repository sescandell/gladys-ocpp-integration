# Instance Gladys JETABLE pour tester l'intégration, sur le Docker de la machine
# de développement (jamais sur celui de la box domotique : au démarrage, Gladys
# supprime les conteneurs d'intégrations externes qu'il ne connaît pas).
#
#   docker compose -f dev/docker-compose.yml up -d     # http://localhost:8080
#   docker compose -f dev/docker-compose.yml down -v   # tout effacer (données comprises)
#
# Gladys tourne en mode réseau "host" (comme une installation standard) : c'est
# ce qui permet aux conteneurs d'intégration de le joindre via la passerelle de
# leur réseau. En mode bridge, la communication entre conteneurs du réseau des
# intégrations est coupée (icc désactivé) et l'intégration ne se connecte jamais.
#
# Sous Docker Desktop le "host" est la VM Linux, pas Windows : le petit relais
# `ui` republie donc l'interface de Gladys sur http://localhost:8080.
# Pas de /dev ni de mode privilégié : aucune clé Zigbee / Z-Wave ici.
name: gladys-test

services:
  gladys:
    image: gladysassistant/gladys:v5
    container_name: gladys-test
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      SERVER_PORT: 80
      TZ: Europe/Paris
      SQLITE_FILE_PATH: /var/lib/gladysassistant/gladys-production.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gladys-test-data:/var/lib/gladysassistant

  ui:
    image: alpine/socat
    container_name: gladys-test-ui
    restart: unless-stopped
    command: tcp-listen:8080,fork,reuseaddr tcp:172.31.250.1:80
    ports:
      - '8080:8080'
    networks:
      - ui

volumes:
  gladys-test-data:

networks:
  ui:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
