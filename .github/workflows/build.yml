# -----------------------------------------------------------------------------
# Build & publish the multi-architecture images.
#
# This repo produces TWO images, built in lockstep from the same version: the
# main integration container (repo root) and the "gateway" sub-container
# (gateway/, its own package.json/Dockerfile). A matrix runs the same
# build+push steps for both, only the Docker build context and the image
# name suffix differ.
#
# Triggers:
#   - a Git version tag (e.g. `v1.2.0`) pushed by hand -> release build;
#   - a manual run (workflow_dispatch) on any branch -> test build;
#   - called by the Release workflow (workflow_call) -> release build for the
#     version it just bumped and tagged.
# Result: two images pushed to the GitHub Container Registry (ghcr.io), for
# linux/amd64 AND linux/arm64 (Raspberry Pi, etc.) -
# `ghcr.io/<repo>:<tag>` (main) and `ghcr.io/<repo>-gateway:<tag>` (gateway).
#
# Manual runs tag the images with the branch name (or the `image-tag` input)
# and never touch `latest`. Release builds tag `:<version>` AND `:latest`.
#
# That is ALL it takes to "publish": tag, push, and the decentralized indexer
# does the rest (no review, no account to create).
# -----------------------------------------------------------------------------
name: Build and publish images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to publish (defaults to the branch name)'
        required: false
        default: ''
  # Called by release.yml after it bumps the version and pushes the tag.
  # A tag pushed with the default GITHUB_TOKEN does NOT re-trigger the
  # `push: tags` build above, so the Release workflow calls this one directly.
  workflow_call:
    inputs:
      version:
        description: 'Released version, e.g. 1.2.0 (publishes :<version> + :latest)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: main
            image_suffix: ''
            context: '.'
          - component: gateway
            image_suffix: '-gateway'
            context: './gateway'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release build (called by release.yml): check out the tag it just
          # created, otherwise the default checkout would be the pre-bump
          # commit and the images would bundle a stale manifest. Hand-pushed
          # tags and manual runs keep the default checkout.
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          INPUT_VERSION: ${{ inputs.version }}
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}${IMAGE_SUFFIX}"
          # Detect a release build by the `version` input, NOT the event name:
          # inside a called (workflow_call) workflow, GITHUB_EVENT_NAME is the
          # caller's event ("workflow_dispatch"), so it cannot tell the two
          # apart. The input is only set when release.yml calls us.
          if [ -n "$INPUT_VERSION" ]; then
            # Release build driven by release.yml: it already bumped and tagged
            # this exact version. Publish `:<version>` AND move `latest`.
            version="${INPUT_VERSION}"
            tags="${image}:${version},${image}:latest"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual test build: use the input tag, or the branch name
            # (slashes replaced by dashes). Never move `latest`.
            version="${INPUT_IMAGE_TAG:-${GITHUB_REF_NAME//\//-}}"
            if [ "$version" = "latest" ]; then
              echo "::error::Cannot use 'latest' as a manual image tag."
              exit 1
            fi
            tags="${image}:${version}"
          else
            # Hand-pushed tag `v1.2.0` -> 1.2.0
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version},${image}:latest"
          fi
          echo "image_ref=${image}:${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Only on the "main" leg: both image refs are fully deterministic from
      # the same version, so this single step can print a combined summary
      # (and a ready-to-paste manifest with BOTH docker_image fields
      # substituted) without waiting on or reading the other matrix leg.
      - name: Docker build summary
        if: matrix.component == 'main'
        env:
          MAIN_IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gateway_image_ref="ghcr.io/${GITHUB_REPOSITORY,,}-gateway:${VERSION}"
          # Manifest with `docker_image` and `containers[0].docker_image`
          # pointing at the images just pushed, ready to paste into Gladys
          # developer mode.
          manifest=$(jq --arg image "$MAIN_IMAGE_REF" --arg gatewayImage "$gateway_image_ref" \
            '.docker_image = $image | .containers[0].docker_image = $gatewayImage' \
            gladys-assistant-integration.json)
          {
            echo "## Docker build summary"
            echo ""
            echo "Images pushed (linux/amd64 + linux/arm64):"
            echo ""
            echo '```'
            echo "main:    ${MAIN_IMAGE_REF}"
            echo "gateway: ${gateway_image_ref}"
            echo '```'
            echo ""
            echo "### Test this build in Gladys"
            echo ""
            echo "1. In Gladys, open **Integrations → Install an integration → Developer mode**."
            echo "2. Copy the manifest below (both \`docker_image\` fields already point to this build):"
            echo ""
            echo '```json'
            echo "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
